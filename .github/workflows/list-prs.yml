name: List Pull Requests

on:
  workflow_dispatch:

jobs:
  list-prs:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.list-prs.outputs.prs }}
    
    steps:
      - name: List open pull requests
        id: list-prs
        run: |
          prs=$(gh pr list --json number,title,headRefName,baseRefName,author,createdAt)
          echo "prs=$prs" >> $GITHUB_OUTPUT
          echo "Found $(echo $prs | jq '. | length') open PRs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Display PRs
        run: |
          echo "Open Pull Requests:"
          echo '${{ steps.list-prs.outputs.prs }}' | jq '.'
