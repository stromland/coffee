<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#1a1410"/>
  <g transform="translate(50, 30)">
    <!-- Cup body -->
    <rect x="20" y="20" width="60" height="90" fill="#C99D7A" stroke="#8B6F47" stroke-width="2"/>
    <!-- Cup rim -->
    <rect x="15" y="10" width="70" height="15" fill="#8B6F47"/>
    <!-- Coffee inside -->
    <rect x="25" y="30" width="50" height="70" fill="#4A3728"/>
    <!-- Handle -->
    <path d="M 90 40 Q 110 50 90 80" stroke="#8B6F47" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Steam left -->
    <path d="M 35 10 Q 30 -5 35 -20" stroke="#C99D7A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Steam right -->
    <path d="M 65 10 Q 70 -5 65 -20" stroke="#C99D7A" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
